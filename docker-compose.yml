name: bookshire-dev

services:
  db:
    image: postgis/postgis:15-3.4
    container_name: bookshire-db
    restart: always
    environment:
      POSTGRES_USER: bookshire
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bookshire
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookshire -d bookshire"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENV: dev
      DATABASE_URL: postgresql://bookshire:password@db:5432/bookshire
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app

volumes:
  postgres_data: