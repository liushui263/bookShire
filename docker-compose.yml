services:
  db:
    image: postgis/postgis:15-3.4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U book -d bookdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_USER: book
      POSTGRES_PASSWORD: book
      POSTGRES_DB: bookdb
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENV: dev
      DATABASE_URL: postgresql+psycopg2://book:book@db:5432/bookdb
    ports:
      - "8000:8000"

volumes:
  postgres_data_dev:
